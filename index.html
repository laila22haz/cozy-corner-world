<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .book-mockup {
            transform-style: preserve-3d;
            transform: perspective(1000px) rotateY(-10deg) rotateX(5deg);
            box-shadow: 20px 20px 60px #d1d1d1, -20px -20px 60px #ffffff;
            transition: 0.5s;
        }
        .book-mockup:hover { transform: perspective(1000px) rotateY(0deg) rotateX(0deg); }
    </style>
</head>
<body class="bg-[#FDF6E3] font-sans flex flex-col items-center justify-center min-h-screen p-6">

    <!-- Title Section -->
    <div class="text-center mb-10">
        <h1 class="text-4xl font-bold text-[#8B5E3C] mb-2">My Wonderful World of WHEELS</h1>
        <p class="text-lg text-[#A07855]">A cozy coloring adventure for your little ones.</p>
    </div>

    <!-- Mockup Container -->
    <div class="book-mockup w-64 h-80 bg-white rounded-r-lg overflow-hidden shadow-2xl mb-10">
        <img src="cover.png" class="w-full h-full object-cover" alt="Ahmed Book Cover">
    </div>

    <!-- CTA Button -->
    <a href="https://ezaquill6.gumroad.com/l/tyksm" 
       class="bg-[#8B5E3C] text-white px-8 py-3 rounded-full text-lg font-semibold hover:bg-[#6F4A2F] transition duration-300 shadow-lg">
       Download & Color Now
    </a>

    <footer class="mt-20 text-[#A07855] text-sm">
        &copy; 2026 Cozy Corner
    </footer>

</body>
</html>
