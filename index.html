<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FFFDF9; /* Creamy light background */
        }
        /* Floating Animation */
        .floating {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotateY(-15deg) rotateX(7deg); }
            50% { transform: translateY(-20px) rotateY(-15deg) rotateX(7deg); }
            100% { transform: translateY(0px) rotateY(-15deg) rotateX(7deg); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">

    <div class="relative w-full max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-center p-10 bg-white/50 rounded-[40px] border border-[#FFDAB9]/30 shadow-2xl">

        <!-- Left: Text content -->
        <div class="flex-1 text-center md:text-left z-10">
            <h1 class="text-5xl font-bold text-[#B8860B] mb-6">Unlock Their <br>Wonderful World</h1>
            <p class="text-lg text-[#556B2F] mb-8 leading-relaxed max-w-md">
                A cozily minimalist activity book inspired by Ahmed's adventure. Every 'WHEEL' teaches faith, fun, and kindness. 
            </p>
            
            <a href="URL_DIAL_GUMROAD" 
               class="inline-block bg-[#8FBC8F] text-white px-10 py-4 rounded-full text-lg font-semibold hover:bg-[#709970] transition-all transform hover:scale-105 shadow-lg shadow-[#8FBC8F]/30">
               Get Their Coloring Adventure
            </a>
        </div>

        <!-- Right: Animated Mockup -->
        <div class="flex-1 flex justify-center mt-12 md:mt-0">
            <div class="relative w-72 h-[400px] bg-white rounded-r-2xl shadow-2xl floating">
                <img src="carre.png" class="w-full h-full object-cover rounded-r-2xl" alt="Ahmed WHEELS Activity Book">
            </div>
        </div>
    </div>

    <footer class="mt-16 text-[#B8860B]/60 text-sm">
        &copy; 2026 Cozy Corner | Minimalist & Creative
    </footer>

</body>
</html>
